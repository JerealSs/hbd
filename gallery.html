<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gallery 📸</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="gallery.css">
</head>
<body>

  <main class="phone">
    <section class="screen gallery-screen" id="gallery-screen">
      <!-- Background -->
      <img class="bg" src="assets/gallery/bg.png" alt="">

      <!-- Ornamen Bunga Atas Kanan -->
      <img class="deco-branch" src="assets/gallery/batang daun.png" alt="">
      
      <!-- Judul Kupu-Kupu -->
      <div class="title-wrap">
        <img class="title-bubble" src="assets/gallery/title-top.png" alt="">
        <p class="title-text">Foto Kamu yang<br>Cantik</p>
      </div>

<!-- Navigasi antar halaman -->
      <button class="nav-arrow prev-arrow" id="prev-page" aria-label="Halaman sebelumnya">
        <img src="assets/gallery/arrow-red.png" alt="">
      </button>
      
      <!-- Ornamen Kucing -->
      <img class="deco-cat" src="assets/gallery/cat.png" alt="">
      
      <button class="nav-arrow next-arrow" id="next-page" aria-label="Halaman selanjutnya">
        <img src="assets/gallery/arrow-green.png" alt="">
      </button>

      <!-- Area Grid Foto Polaroid -->
      <div class="gallery-wrapper">
        <!-- Bingkai polaroid -->
        <img class="border-frame" src="assets/gallery/border.png" alt="">
      </div>

      <!-- Ornamen Bawah (Teratai & Tulip) -->
      <img class="deco-lotus" src="assets/gallery/bottom-lotus.png" alt="">
      <img class="deco-tulips left" src="assets/gallery/sakura-bl.png" alt="">
      <!-- Tulip kanan kita flip sedikit agar simetris dengan desain -->
      <img class="deco-tulips right" src="assets/gallery/sakura-bl.png" alt="">

    </section>
  </main>

<script src="gallery.js"></script>
</body>
</html>
